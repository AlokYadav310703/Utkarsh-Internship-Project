services:
  postgres:
    image: postgres:16-alpine
    container_name: utkarsh-postgres
    environment:
      POSTGRES_DB: utkarsh_scholarship
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d utkarsh_scholarship"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    container_name: utkarsh-app
    build:
      context: .
      args:
        VITE_API_URL: /api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://127.0.0.1:5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/utkarsh_scholarship?schema=public
      JWT_SECRET: replace-this-in-production
      PUBLIC_UPLOAD_URL: http://127.0.0.1:5000/uploads
      UPLOAD_DIR: /app/server/uploads
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-"false"}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-"Utkarsh Scholarship <noreply@aderf.co.in>"}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/server/uploads
    command: sh -c "npx prisma migrate deploy && npm run prisma:seed && node --dns-result-order=ipv4first server/index.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads:
